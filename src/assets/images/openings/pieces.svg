<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Line-up of chess pieces on an ivory board representing opening study">
  <rect width="600" height="400" fill="#F6F1E7"/>
  <g transform="translate(60 80)">
    <rect x="0" y="0" width="480" height="240" fill="#EFE8D8" stroke="#0F0F0E" stroke-width="1"/>
    <g stroke="#0F0F0E" stroke-width="0.5" opacity="0.35">
      <line x1="60" y1="0" x2="60" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/><line x1="300" y1="0" x2="300" y2="240"/><line x1="360" y1="0" x2="360" y2="240"/><line x1="420" y1="0" x2="420" y2="240"/>
      <line x1="0" y1="60" x2="480" y2="60"/><line x1="0" y1="120" x2="480" y2="120"/><line x1="0" y1="180" x2="480" y2="180"/>
    </g>
    <g font-family="Georgia, serif" font-size="46" text-anchor="middle" fill="#0F0F0E">
      <text x="30" y="45">♜</text><text x="90" y="45">♞</text><text x="150" y="45">♝</text><text x="210" y="45">♛</text><text x="270" y="45">♚</text><text x="330" y="45">♝</text><text x="390" y="45">♞</text><text x="450" y="45">♜</text>
    </g>
    <g font-family="Georgia, serif" font-size="34" text-anchor="middle" fill="#0F0F0E" opacity="0.7">
      <text x="30" y="105">♟</text><text x="90" y="105">♟</text><text x="150" y="105">♟</text><text x="210" y="105">♟</text><text x="270" y="105">♟</text><text x="330" y="105">♟</text><text x="390" y="105">♟</text><text x="450" y="105">♟</text>
    </g>
  </g>
  <text x="300" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#0F0F0E" letter-spacing="4" opacity="0.7">FIRST PRINCIPLES · OPENING STUDY</text>
</svg>
