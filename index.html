        <p style="margin:0 0 12px"><em>An independent educational publication about chess for adults 50 and above.</em></p>
        <p>
          Senior Chess Academy is a small editorial publication that writes long-form articles about chess strategy,
          endgame technique, positional play, tournament preparation, and the classic grandmasters. Every article is
          written and reviewed by the editors before publication. We do not publish AI-generated filler content, we do
          not sell products, and we do not offer medical advice.
        </p>
